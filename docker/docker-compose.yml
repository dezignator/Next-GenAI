# docker/docker-compose.yml
# Kafka + Flink + Zookeeper stack for Next-GenAI streaming pipeline.
# Usage: docker-compose -f docker/docker-compose.yml up -d

version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: nextgenai-zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks: [nextgenai]

  kafka:
    image: bitnami/kafka:3.6
    container_name: nextgenai-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [nextgenai]

  jobmanager:
    image: flink:1.18-scala_2.12
    container_name: nextgenai-flink-jm
    depends_on: [kafka]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks: [nextgenai]

  taskmanager:
    image: flink:1.18-scala_2.12
    container_name: nextgenai-flink-tm
    depends_on: [jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4096m
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks: [nextgenai]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nextgenai-kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "nextgenai"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    networks: [nextgenai]

volumes:
  flink-checkpoints:

networks:
  nextgenai:
    driver: bridge
